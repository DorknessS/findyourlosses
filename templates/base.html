<!doctype html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lost & Found{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar">
    <a class="brand" href="{{ url_for('home') if session.get('user_id') else url_for('login') }}">
        Lost<span>&</span>Found
    </a>
    {% if session.get('user_id') %}
    <div class="navlinks">
        <a href="{{ url_for('home') }}">หน้าหลัก</a>
        <a href="{{ url_for('new_item', item_type='lost') }}">แจ้งของหาย</a>
        <a href="{{ url_for('new_item', item_type='found') }}">แจ้งของที่พบ</a>
        <a href="{{ url_for('items') }}">ค้นหารายการ</a>
        <a href="{{ url_for('profile') }}">โปรไฟล์</a>
        <a class="logout" href="{{ url_for('logout') }}">ออกจากระบบ</a>
    </div>
    {% endif %}
</nav>

<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
