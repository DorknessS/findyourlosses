{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="logo">🔎</div>
    <h1>Lost & Found</h1>
    <p class="muted">ระบบแจ้งของหาย / ของที่พบ</p>
    <form method="post">
        <label>ชื่อผู้ใช้</label>
        <input name="username" required>
        <label>รหัสผ่าน</label>
        <input type="password" name="password" required>
        <button class="btn primary">เข้าสู่ระบบ</button>
    </form>
    <p class="switch">ยังไม่มีบัญชี? <a href="{{ url_for('register') }}">สมัครสมาชิก</a></p>
</div>
{% endblock %}
